    /*
      Breakpoints (WCAG 1.4.10 & Internal Website Standard):

    */
    :root {
      --font-family: "Noto Sans Thai", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --page-min-width: 320px;
      --content-max-width: 1536px;
      --page-padding: 32px;
      --topbar-height: 64px;
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      :root { --page-padding: 24px; }
    }
    @media (max-width: 767px) {
      :root { --page-padding: 16px; --topbar-height: 56px; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: var(--page-min-width);
      font-family: var(--font-family);
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 9999px; }

    .stats-header {
      height: var(--topbar-height);
      padding: 0 max(var(--page-padding), calc((100% - var(--content-max-width)) / 2 + var(--page-padding)));
    }
    .stats-body {
      max-width: var(--content-max-width);
      padding: var(--page-padding);
    }

    .data-table th:first-child, .data-table td:first-child { position: sticky; left: 0; border-right: 1px solid #f1f5f9; }
    .data-table th:first-child { z-index: 2; }
    .data-table td:first-child { z-index: 1; background: #fff; }
    .data-table tbody tr:hover td { background: #f8fafc; }

    .tone-complete { --tone: #5bc26a; }
    .tone-partial { --tone: #4b5563; }
    .tone-pending { --tone: #ee7d38; }
    .tone-dot { background: var(--tone, #94a3b8); }

    .chart-axis { fill: #94a3b8; font-size: 11px; font-variant-numeric: tabular-nums; }
    .chart-dim path { opacity: 0.35; }
    .chart-hit { fill: transparent; outline: none; }
    .chart-hit:focus-visible { stroke: #94a3b8; stroke-dasharray: 3 3; }

    @keyframes fade { from { opacity: 0; } }
    @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
    .drawer-backdrop { animation: fade 0.15s ease-out; }
    .drawer-panel { animation: slide 0.2s ease-out; overscroll-behavior: contain; }
  </style>

    const USAGE_STATUS = {

    };
    const THAI_MONTHS_SHORT = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const formatNumber = (value) => (value == null ? "—" : value.toLocaleString("en-US"));
    const formatPercent = (value) => (value == null ? "—" : `${value.toFixed(2)}%`);
    const formatThaiDateTime = (iso) => (iso ? new Date(iso).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }) : "—");
    const toYearMonth = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    const starValue = (value) => (value == null ? "—" : `<span class="inline-flex items-baseline gap-1"><span class="text-[#eda100]" aria-hidden="true">★</span>${value.toFixed(2)}</span>`);
    const formatRate = (part, whole) => (whole > 0 ? `${((part / whole) * 100).toFixed(2)}%` : "—");
    function formatDuration(seconds) {
      if (seconds == null) return "—";
      const minutes = seconds / 60;
      if (minutes < 60) return `${minutes.toFixed(2)} นาที`;
      const hours = minutes / 60;
      if (hours < 48) return `${hours.toFixed(2)} ชม.`;
      return `${(hours / 24).toFixed(2)} วัน`;
    }
    function formatThaiMonth(yearMonth) {
      const [year, month] = yearMonth.split("-").map(Number);
      return `${THAI_MONTHS_SHORT[month - 1]} ${year + 543}`;
    }
    const panel = (title, body, extra = "") => `
      <section class="p-4 border border-slate-200 rounded-2xl bg-white ${extra}">
        <h2 class="mt-0 mb-3 text-[15px] font-semibold text-slate-900">${title}</h2>${body}
      </section>`;

    const params = new URLSearchParams(location.search);
    const province = params.get("province");
    const detail = DETAILS[province];

    function usageBadge(status) {
      const { label, tone } = USAGE_STATUS[status] ?? { label: status, tone: "" };
      return `<span class="tone-${tone} flex-shrink-0 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs font-medium whitespace-nowrap"><span class="tone-dot w-1.5 h-1.5 rounded-full"></span>${escapeHtml(label)}</span>`;
    }

    function finishMeter(percent) {
      if (percent == null) return `<span class="text-slate-400">—</span>`;
      const health = percent >= 75
        ? { fill: "#0ca30c", track: "#dcf5dc", label: "ดี", icon: "circle-check" }
        : percent >= 50
          ? { fill: "#fab219", track: "#fef1d2", label: "พอใช้", icon: "triangle-alert" }
          : { fill: "#d03b3b", track: "#f8dddd", label: "ต้องติดตาม", icon: "circle-alert" };
      return `
        <div class="grid grid-cols-[56px_minmax(64px,1fr)_84px] items-center gap-2">
          <span class="text-[13px] font-semibold text-slate-900 text-right tabular-nums">${percent.toFixed(2)}%</span>
          <span class="h-1.5 rounded-full overflow-hidden" style="background:${health.track}"><span class="block h-full rounded-full" style="width:${Math.min(percent, 100)}%;background:${health.fill}"></span></span>

      return `

          ${fields.map(({ key, label, format }) => `

              <p class="m-0 text-[13px] text-slate-500">${label}</p>
              <p class="m-0 text-[22px] font-semibold leading-tight text-slate-900">${format(summary[key])}</p>
            </div>`).join("")}
        </section>`;
    }

    /* ---------- กราฟรายเดือน ---------- */
    const MONTHS = 12;
    const HEIGHT = 220;
    const PLOT = { left: 44, right: 8, top: 8, bottom: 36 };
    const chartState = { months: [], active: null, width: 640 };

    function lastMonths(monthly) {
      if (!monthly.length) return [];
      const byMonth = Object.fromEntries(monthly.map((m) => [m.ym, m]));
      const [year, month] = monthly.map((m) => m.ym).sort().at(-1).split("-").map(Number);
      return Array.from({ length: MONTHS }, (_, i) => {
        const ym = toYearMonth(new Date(year, month - MONTHS + i, 1));
        const { total_messages: total = 0, finished = 0 } = byMonth[ym] ?? {};
        return { ym, total, finished, open: total - finished };
      });
    }
    function niceMax(value) {
      if (value <= 0) return 1;
      const step = 10 ** Math.floor(Math.log10(value));
      return [1, 2, 2.5, 5, 10].map((m) => m * step).find((n) => n >= value);
    }
    // rounds only the top end, so the bar stays anchored to the baseline
    function barPath(x, y, w, h, radius) {
      const r = Math.min(radius, h, w / 2);
      return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
    }

    function renderChart() {
      const { months, active, width } = chartState;
      const current = months[active ?? months.length - 1];
      document.getElementById("chart-readout").innerHTML = current
        ? `<strong class="text-slate-900 font-semibold">${formatThaiMonth(current.ym)}</strong> · แจ้ง ${formatNumber(current.total)} · เสร็จ ${formatNumber(current.finished)}${current.total > 0 ? ` (${((current.finished / current.total) * 100).toFixed(2)}%)` : ""}`
        : "";

      const max = niceMax(Math.max(...months.map((m) => m.total), 0));
      const plotH = HEIGHT - PLOT.top - PLOT.bottom;
      const band = (width - PLOT.left - PLOT.right) / MONTHS;
      const barW = band * 0.6;
      const labelEvery = band < 36 ? 2 : 1;
      const y = (v) => PLOT.top + plotH - (v / max) * plotH;
      const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => t * max);

      const grid = ticks.map((t) => `
        <line x1="${PLOT.left}" x2="${width - PLOT.right}" y1="${y(t)}" y2="${y(t)}" stroke="#f1f5f9" />
        <text class="chart-axis" x="${PLOT.left - 8}" y="${y(t)}" dy="0.32em" text-anchor="end">${formatNumber(t)}</text>`).join("");

      const bars = months.map((m, i) => {
        const x = PLOT.left + i * band + (band - barW) / 2;
        const finishedH = y(0) - y(m.finished);
        const openH = Math.max(y(0) - y(m.total) - finishedH - (m.finished && m.open ? 2 : 0), 0);
        const [year, month] = m.ym.split("-").map(Number);
        const showLabel = (MONTHS - 1 - i) % labelEvery === 0;
        const yearLabel = i < labelEvery || month <= labelEvery
          ? `<tspan x="${x + barW / 2}" dy="1.2em">${String(year + 543).slice(-2)}</tspan>` : "";
        return `
          <g class="${active != null && active !== i ? "chart-dim" : ""}">
            ${m.finished > 0 ? `<path fill="#008300" d="${barPath(x, y(m.finished), barW, finishedH, m.open ? 0 : 4)}" />` : ""}
            ${m.open > 0 ? `<path fill="#eda100" d="${barPath(x, y(m.total), barW, openH, 4)}" />` : ""}
            ${showLabel ? `<text class="chart-axis" x="${x + barW / 2}" y="${HEIGHT - PLOT.bottom + 16}" text-anchor="middle">${THAI_MONTHS_SHORT[month - 1]}${yearLabel}</text>` : ""}
            <rect class="chart-hit" x="${PLOT.left + i * band}" y="${PLOT.top}" width="${band}" height="${plotH}" tabindex="0"
              aria-label="${formatThaiMonth(m.ym)} แจ้ง ${m.total} เสร็จ ${m.finished}"
              onmouseenter="setActiveMonth(${i})" onmouseleave="setActiveMonth(null)" onclick="setActiveMonth(${i})"
              onfocus="setActiveMonth(${i})" onblur="setActiveMonth(null)" />
          </g>`;
      }).join("");

      document.getElementById("chart-svg").outerHTML =
        `<svg id="chart-svg" class="block w-full h-auto overflow-visible" viewBox="0 0 ${width} ${HEIGHT}" role="img" aria-label="กราฟเรื่องแจ้งรายเดือน 12 เดือนล่าสุด">${grid}${bars}</svg>`;
    }
    function setActiveMonth(index) {
      chartState.active = index;
      renderChart();
    }

    function chartPanel() {
      return `
        <section class="min-w-0 p-4 border border-slate-200 rounded-2xl bg-white">
          <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1">
            <h2 class="m-0 text-[15px] font-semibold text-slate-900">เรื่องแจ้งรายเดือน</h2>
            <div class="flex gap-3 text-xs text-slate-600">
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-[3px] bg-[#008300]"></span>เสร็จแล้ว</span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-[3px] bg-[#eda100]"></span>ยังไม่เสร็จ</span>
            </div>
          </div>
          <p id="chart-readout" class="min-h-5 mt-2 mb-1 text-xs md:text-[13px] text-slate-600 tabular-nums" aria-live="polite"></p>
          <div id="chart-wrap" class="min-w-0"><svg id="chart-svg"></svg></div>
        </section>`;
    }

    /* ---------- Breakdown ---------- */
    function breakdownPanel(title, items, { scroll = false, color = "#2a78d6" } = {}) {
      const list = items.map(({ label, count, percent, note }) => `
        <li class="grid grid-cols-[minmax(0,1fr)_auto_52px] items-baseline gap-x-3 gap-y-0.5 text-[13px]">
          <span class="truncate text-slate-700">${escapeHtml(label)}</span>
          <span class="font-semibold text-slate-900 tabular-nums text-right">${formatNumber(count)}</span>
          <span class="text-slate-500 tabular-nums text-right">${percent.toFixed(1)}%</span>
          <span class="col-span-3 h-1.5 rounded-full bg-[#eef2f7] overflow-hidden"><span class="block h-full rounded-full" style="width:${Math.min(percent, 100)}%;background:${color}"></span></span>
          ${note ? `<span class="col-span-3 text-xs text-slate-400">${escapeHtml(note)}</span>` : ""}
        </li>`).join("");
      return panel(title, `<ul class="grid gap-2.5 m-0 p-0 list-none ${scroll ? "max-h-[340px] overflow-y-auto pr-1" : ""}">${list}</ul>`, "h-full");
    }

    /* ---------- ตารางหน่วยงาน ---------- */
    const ORG_COLUMNS = [
      { key: "org_name", label: "หน่วยงาน" },
      { key: "total_messages", label: "เรื่องแจ้ง", numeric: true },
      { key: "total_reporters", label: "ผู้แจ้ง", numeric: true },
      { key: "finish_percentage", label: "ดำเนินการเสร็จ" },
      { key: "median_accept_time_sec", label: "รับเรื่อง (Median)", numeric: true },
      { key: "median_finish_time_sec", label: "แก้เสร็จ (Median)", numeric: true },
      { key: "avg_star", label: "ดาวเฉลี่ย", numeric: true },
      { key: "total_reopen", label: "เปิดซ้ำ", numeric: true },
      { key: "last_activity", label: "ใช้งานล่าสุด", numeric: true },
    ];
    const orgState = { sort: { key: "total_messages", desc: true } };

    function compareRows(a, b, { key, desc }) {
      if (a[key] == null) return 1;
      if (b[key] == null) return -1;
      const result = typeof a[key] === "string" ? a[key].localeCompare(b[key], "th") : a[key] - b[key];
      return desc ? -result : result;
    }
    function sortOrgs(key) {
      const prev = orgState.sort;
      orgState.sort = { key, desc: prev.key === key ? !prev.desc : key !== "org_name" };
      renderOrgTable();
    }

    function orgPanel() {
      return `
        <section class="min-w-0 p-4 border border-slate-200 rounded-2xl bg-white">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
            <h2 class="m-0 text-[15px] font-semibold text-slate-900">หน่วยงานในจังหวัด<span class="ml-2 text-slate-400 font-medium">${formatNumber(detail.total_orgs)}</span></h2>
            <label class="flex items-center gap-1.5 w-full md:w-[260px] h-9 px-2.5 border border-slate-200 rounded-[10px] text-slate-400 focus-within:border-slate-400">
              <i data-lucide="search" class="w-4 h-4"></i>
              <input id="org-search" type="search" placeholder="ค้นหาหน่วยงาน" oninput="renderOrgTable()" class="w-full border-0 outline-none bg-transparent text-slate-900 text-sm">
            </label>
          </div>
          <div class="max-h-[70vh] overflow-auto border border-slate-100 rounded-xl">
            <table class="data-table w-full min-w-[1180px] border-separate border-spacing-0 text-sm">
              <thead id="org-head"></thead>
              <tbody id="org-body"></tbody>
            </table>
            <p id="org-empty" class="hidden m-0 p-6 text-sm text-slate-500 text-center">ไม่พบหน่วยงานที่ค้นหา</p>
          </div>
          <p class="mt-2 mb-0 text-xs text-slate-400"><i data-lucide="info" class="inline w-3.5 h-3.5 -mt-0.5"></i> Mock แสดง ${detail.orgs.length} หน่วยงานที่มีเรื่องแจ้งมากที่สุด จากทั้งหมด ${formatNumber(detail.total_orgs)} หน่วยงาน</p>
        </section>`;
    }

    function renderOrgTable() {
      const { sort } = orgState;
      const keyword = document.getElementById("org-search").value.trim();
      const rows = detail.orgs.filter((org) => org.org_name.includes(keyword)).sort((a, b) => compareRows(a, b, sort));
      document.getElementById("org-head").innerHTML = `<tr>${ORG_COLUMNS.map(({ key, label, numeric }) => `
        <th class="sticky top-0 z-[1] p-0 border-b border-slate-200 bg-slate-50 text-slate-500 text-xs font-semibold whitespace-nowrap ${numeric ? "text-right" : "text-left"}">
          <button type="button" onclick="sortOrgs('${key}')" class="w-full flex items-center gap-1 px-3 py-2.5 hover:text-slate-900 ${numeric ? "justify-end" : ""}">
            ${label}${sort.key === key ? `<i data-lucide="${sort.desc ? "arrow-down" : "arrow-up"}" class="w-3 h-3"></i>` : ""}
          </button>
        </th>`).join("")}<th class="sticky top-0 border-b border-slate-200 bg-slate-50"></th></tr>`;
      const td = "px-3 py-2 border-b border-slate-100 text-slate-700 whitespace-nowrap";
      document.getElementById("org-body").innerHTML = rows.map((org) => `
        <tr class="cursor-pointer group" onclick="openOrg(${org.org_group_id})">
          <td class="${td} max-w-[180px] md:max-w-[320px]">
            <span class="block truncate font-semibold text-slate-900 group-hover:text-blue-600 group-hover:underline">${escapeHtml(org.org_name)}</span>
            <span class="block truncate text-xs text-slate-400">${escapeHtml(org.agency_type)}</span>
          </td>
          <td class="${td} text-right tabular-nums">${formatNumber(org.total_messages)}</td>
          <td class="${td} text-right tabular-nums">${formatNumber(org.total_reporters)}</td>
          <td class="${td}">${finishMeter(org.finish_percentage)}</td>
          <td class="${td} text-right tabular-nums">${formatDuration(org.median_accept_time_sec)}</td>
          <td class="${td} text-right tabular-nums">${formatDuration(org.median_finish_time_sec)}</td>
          <td class="${td} text-right tabular-nums">${starValue(org.avg_star)}</td>
          <td class="${td} text-right tabular-nums">${formatNumber(org.total_reopen)}</td>
          <td class="${td} text-right tabular-nums">${formatThaiDateTime(org.last_activity)}</td>
          <td class="${td} w-px pl-0 text-slate-300 group-hover:text-slate-500"><i data-lucide="chevron-right" class="w-4 h-4"></i></td>
        </tr>`).join("");
      document.getElementById("org-empty").classList.toggle("hidden", rows.length > 0);
      lucide.createIcons();
    }

    /* ---------- Drawer หน่วยงาน (?org=) ---------- */
    function openOrg(id) {
      const url = new URL(location.href);
      url.searchParams.set("org", id);
      history.pushState({ org: id }, "", url);
      renderDrawer();
    }
    function closeOrg() {
      const url = new URL(location.href);
      url.searchParams.delete("org");
      history.replaceState({}, "", url);
      renderDrawer();
    }

    // award durations are in minutes, unlike the province data
    const METRICS = [
      { label: "ความพึงพอใจ", detail: (s) => `${starValue(s.avg_star)}/5 ดาว (จาก ${formatNumber(s.total_messages_star)} รีวิว)` },
      {
        label: "อัตราการแก้ไขสำเร็จด้วยตนเอง",
        detail: (s) => {
          const relevant = s.total_messages_all - s.total_messages_irrelevant;
          return `${formatRate(s.total_messages_finish_by_org, relevant)} (${formatNumber(s.total_messages_finish_by_org)}/${formatNumber(relevant)} เรื่อง)`;
        },
      },
      { label: "ความเร็วในการแก้ไข", detail: (s) => `Median ${formatDuration(s.duration_finish_median * 60)}` },
      { label: "ความเร็วในการรับเรื่อง", detail: (s) => `Median ${formatDuration(s.duration_inprogress_median * 60)}` },
      {
        label: "อัตรางานไม่ถูกส่งกลับซ้ำ",
        detail: (s) => {
          const notReopened = Math.max(s.total_messages_finish_by_org - s.sum_count_reopen, 0);
          return `${formatRate(notReopened, s.total_messages_finish_by_org)} (ไม่ถูกเปิดซ้ำ ${formatNumber(notReopened)}/${formatNumber(s.total_messages_finish_by_org)} เรื่อง)`;
        },
      },
    ];

    function scoreCard(score) {
      return `
        <div class="grid gap-4">
          <p class="flex items-start gap-1.5 m-0 text-sm text-slate-600 leading-normal">
            <i data-lucide="circle-check" class="w-4 h-4 mt-[3px] flex-shrink-0 text-[#0ca30c]"></i>
            <span>แก้ไขด้วยตนเองสำเร็จ <strong class="text-slate-900 font-semibold">${formatNumber(score.total_messages_finish_by_org)}</strong> เรื่อง (จากทั้งหมด ${formatNumber(score.total_messages_all)} เรื่อง)</span>
          </p>
          <ul class="m-0 p-0 list-none border-t border-slate-100">
            ${METRICS.map(({ label, detail: format }) => `
              <li class="grid grid-cols-1 min-[480px]:grid-cols-[minmax(0,1fr)_auto] items-baseline gap-x-4 gap-y-1 py-3 border-b border-slate-100 text-sm">
                <span class="text-slate-600">${label}</span>
                <span class="font-semibold text-slate-900 tabular-nums min-[480px]:text-right">${format(score)}</span>
              </li>`).join("")}
          </ul>
          <dl class="grid grid-cols-2 gap-3 m-0">
            ${[["เรื่องไม่เกี่ยวข้อง", score.total_messages_irrelevant], ["ผู้แจ้ง", score.total_user_report]].map(([label, value]) => `
              <div class="px-3 py-2.5 border border-slate-100 rounded-[10px]">
                <dt class="text-xs text-slate-500">${label}</dt>
                <dd class="mt-0.5 mx-0 mb-0 text-base font-semibold text-slate-900 tabular-nums">${formatNumber(value)}</dd>
              </div>`).join("")}
          </dl>
          <p class="m-0 text-xs text-slate-400 leading-normal">ข้อมูลสะสมตั้งแต่เริ่มใช้งาน นับเฉพาะเรื่องที่หน่วยงานรับจัดการเอง ตัวเลขจึงต่างจากตารางจังหวัด · อัปเดต ${formatThaiDateTime(score.updated_at)}</p>
        </div>`;
    }

    function renderDrawer() {
      const root = document.getElementById("drawer-root");
      const id = new URLSearchParams(location.search).get("org");
      const org = id && detail?.orgs.find((o) => String(o.org_group_id) === id);
      if (!org) {
        root.innerHTML = "";
        return;
      }
      const score = AWARDS[id];
      root.innerHTML = `
        <div class="drawer-backdrop fixed inset-0 z-50 flex justify-end bg-slate-900/35" onclick="closeOrg()">
          <aside class="drawer-panel w-full max-w-[480px] h-full flex flex-col bg-white shadow-[-8px_0_24px_rgba(15,23,42,0.12)]" role="dialog" aria-modal="true" aria-labelledby="org-title" onclick="event.stopPropagation()">
            <div class="flex-shrink-0 flex items-start justify-between gap-3 px-4 py-3.5 md:px-5 md:py-4 border-b border-slate-200">
              <div class="min-w-0 grid gap-0.5">
                <h2 id="org-title" class="m-0 text-[17px] font-semibold text-slate-900 leading-snug">${escapeHtml(score?.fonduegroup_name ?? org.org_name)}</h2>
                <span class="text-[13px] text-slate-500">${escapeHtml(org.agency_type)}</span>
              </div>
              <button type="button" onclick="closeOrg()" class="flex-shrink-0 grid place-items-center w-[34px] h-[34px] border border-slate-200 rounded-[10px] bg-white text-slate-600 hover:bg-slate-100" aria-label="ปิด">
                <i data-lucide="x" class="w-[18px] h-[18px]"></i>
              </button>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto p-4 md:p-5">
              ${score ? scoreCard(score) : `<p class="m-0 p-6 text-sm text-slate-500 text-center">หน่วยงานนี้ยังไม่มีข้อมูลคะแนน Fondue Award</p>`}
            </div>
          </aside>
        </div>`;
      lucide.createIcons();
      root.querySelector("button[aria-label='ปิด']").focus({ preventScroll: true });
    }
    window.addEventListener("popstate", renderDrawer);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.getElementById("drawer-root").innerHTML) closeOrg();
    });

    /* ---------- render ---------- */
    document.title = `จังหวัด${province ?? ""} - สถิติกลุ่มหน่วยงาน`;
    document.getElementById("page-title").textContent = `จังหวัด${province ?? ""}`;

    if (!detail) {
      document.getElementById("page-body").innerHTML = `
        <div class="p-6 rounded-2xl border border-slate-200 bg-white text-center text-sm text-slate-600">
          Mock นี้มีรายละเอียดเฉพาะ ${Object.keys(DETAILS).map((name) => `<a class="text-blue-600 hover:underline" href="?province=${encodeURIComponent(name)}">${escapeHtml(name)}</a>`).join(", ")}
        </div>`;
    } else {
      document.getElementById("page-badge").outerHTML = usageBadge(detail.summary.usage_status);
      document.getElementById("page-updated").textContent = `อัปเดต ${formatThaiDateTime(detail.updated_at)}`;
      const statusItems = detail.by_status.map(({ status, count, percentage }) => ({ label: REPORT_STATUS[status] ?? status, count, percent: percentage }));
      const starItems = [...detail.by_star]
        .sort((a, b) => (b.star ?? -1) - (a.star ?? -1))
        .map(({ star, count, percentage }) => ({ label: star == null ? "ไม่ได้ให้คะแนน" : `${star} ดาว`, count, percent: percentage }));
      const problemItems = detail.problem_types.map(({ problem_type, total_messages, percentage, finish_percentage }) => ({
        label: problem_type, count: total_messages, percent: percentage, note: `ดำเนินการเสร็จ ${formatPercent(finish_percentage)}`,
      }));

      document.getElementById("page-body").innerHTML = `
        ${summaryTiles(detail.summary)}
        <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] gap-4">
          ${chartPanel()}
          ${breakdownPanel("สถานะเรื่องแจ้ง", statusItems)}
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] gap-4">
          ${breakdownPanel("ประเภทปัญหา", problemItems, { scroll: true })}
          ${breakdownPanel("คะแนนความพึงพอใจ", starItems, { color: "#eda100" })}
        </div>
        ${orgPanel()}`;

      chartState.months = lastMonths(detail.monthly);
      // drawn at the real pixel width so axis text stays legible on phones
      new ResizeObserver(([entry]) => {
        chartState.width = Math.round(entry.contentRect.width) || 640;
        renderChart();
      }).observe(document.getElementById("chart-wrap"));
      renderOrgTable();
      renderDrawer();
    }
    lucide.createIcons();
  </script>
</body>
</html>
