<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถิติกลุ่มหน่วยงาน - Traffy Fondue Internal Website</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /*
      Breakpoints (WCAG 1.4.10 & Internal Website Standard):
        mobile   ≤ 767px    tablet 768–1023px    desktop ≥ 1024px
    */
    :root {
      --font-family: "Noto Sans Thai", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --page-min-width: 320px;
      --content-max-width: 1536px;
      --page-padding: 32px;
      --topbar-height: 64px;
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      :root { --page-padding: 24px; }
    }
    @media (max-width: 767px) {
      :root { --page-padding: 16px; --topbar-height: 56px; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: var(--page-min-width);
      font-family: var(--font-family);
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 9999px; }

    .stats-header {
      height: var(--topbar-height);
      padding: 0 max(var(--page-padding), calc((100% - var(--content-max-width)) / 2 + var(--page-padding)));
    }
    .stats-body {
      max-width: var(--content-max-width);
      padding: var(--page-padding);
    }
    @media (min-width: 1024px) {
      .stats-page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
      .stats-body { flex: 1; min-height: 0; }
      .stats-body .provinces { min-height: 0; }
    }
    @media (max-width: 1023px) {
      .stats-body .provinces { height: 80vh; height: 80dvh; }
    }

    /* sticky name column while the wide table scrolls sideways */
    .data-table th:first-child, .data-table td:first-child { position: sticky; left: 0; border-right: 1px solid #f1f5f9; }
    .data-table th:first-child { z-index: 2; }
    .data-table td:first-child { z-index: 1; background: #fff; }
    .data-table tbody tr:hover td { background: #f8fafc; }

    .tone-all { --tone: #111827; --tone-soft: #f1f5f9; }
    .tone-complete { --tone: #5bc26a; --tone-soft: #f0faf1; }
    .tone-partial { --tone: #4b5563; --tone-soft: #f3f4f6; }
    .tone-pending { --tone: #ee7d38; --tone-soft: #fff4ec; }
    .filter-option:hover { background: var(--tone-soft); }
    .filter-option.is-active { border-color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone); background: var(--tone-soft); }
    .filter-check { background: var(--tone); }
    .tone-dot { background: var(--tone); }

    .month-in-range { background: #e2e8f0 !important; color: #0f172a; }
    .month-selected { background: #111827 !important; color: #fff !important; }
    .month-has-data::after {
      content: ""; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px;
      border-radius: 50%; background: #2563eb; transform: translateX(-50%);
    }
    .month-selected.month-has-data::after { background: #fff; }

    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
    .toast { animation: toast-in 0.2s ease-out; }
  </style>
</head>
<body>
  <div class="stats-page">
    <header class="stats-header sticky top-0 z-20 flex items-center gap-3 sm:gap-4 border-b border-slate-200 bg-white flex-shrink-0">
      <a href="./index.html" onclick="return goBack()" class="flex items-center justify-center gap-1.5 h-9 w-9 md:w-auto md:px-3 border border-slate-200 rounded-[10px] bg-white text-slate-700 text-sm font-medium hover:bg-slate-100 flex-shrink-0" aria-label="กลับ">

        <span class="hidden md:inline">กลับ</span>

      <h1 class="m-0 text-base md:text-lg font-semibold text-slate-900 truncate">สถิติกลุ่มหน่วยงาน</h1>

        <i data-lucide="flask-conical" class="w-3 h-3"></i>
        Mock · ข้อมูลจริง snapshot <span id="snapshot-date"></span>
      </span>
    </header>

    <main class="stats-body w-full mx-auto grid gap-4 grid-cols-1 lg:grid-cols-[minmax(300px,340px)_minmax(0,1fr)] lg:grid-rows-[auto_minmax(0,1fr)]">

          <h2 class="m-0 text-[15px] font-semibold text-slate-900">ภาพรวมทั้งระบบ</h2>
          <span id="overall-updated" class="text-xs text-slate-400"></span>
        </div>
        <div id="overall-tiles" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      </section>

      <!-- สถิติรายเดือน -->
      <section class="flex flex-col min-h-0 p-4 border border-slate-200 rounded-2xl bg-white">
        <div class="flex items-center justify-between gap-3 mb-3">
          <h2 class="m-0 text-[15px] font-semibold text-slate-900">สถิติรายเดือน</h2>
          <div class="relative" id="month-picker">
            <button type="button" id="month-trigger" onclick="toggleMonthPicker()" class="flex items-center gap-1.5 h-[34px] px-3 border border-slate-200 rounded-[10px] bg-white text-slate-700 text-sm font-medium whitespace-nowrap hover:bg-slate-50">
              <i data-lucide="calendar-days" class="w-4 h-4"></i>
              <span id="month-label"></span>
            </button>
            <div id="month-popover" class="hidden absolute top-[calc(100%+6px)] right-0 z-30 w-[248px] p-3 border border-slate-200 rounded-xl bg-white shadow-[0_10px_30px_rgba(15,23,42,0.12)]" role="dialog" aria-label="เลือกช่วงเดือน">
              <div class="flex items-center justify-between mb-2">
                <button type="button" id="year-prev" onclick="shiftViewYear(-1)" class="w-[30px] h-[30px] flex items-center justify-center rounded-lg text-slate-700 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed" aria-label="ปีก่อนหน้า"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <span id="view-year" class="text-[15px] font-semibold text-slate-900"></span>
                <button type="button" id="year-next" onclick="shiftViewYear(1)" class="w-[30px] h-[30px] flex items-center justify-center rounded-lg text-slate-700 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed" aria-label="ปีถัดไป"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              </div>
              <div id="month-grid" class="grid grid-cols-3 gap-1.5" onmouseleave="setHoveredMonth(null)"></div>
              <p id="month-hint" class="mt-2.5 mb-0 text-xs text-slate-500 text-center"></p>
            </div>
          </div>
        </div>
        <p id="monthly-coverage" class="hidden mt-0 mb-2 text-xs text-amber-700"></p>
        <div id="monthly-tiles" class="flex-1 min-h-0 overflow-y-auto grid grid-cols-[repeat(auto-fit,minmax(140px,1fr))] lg:flex lg:flex-col gap-2"></div>
      </section>

      <!-- สุขภาพรายจังหวัด -->
      <section class="provinces flex flex-col p-4 border border-slate-200 rounded-2xl bg-white">
        <div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1">
          <h2 class="m-0 text-[15px] font-semibold text-slate-900">สุขภาพรายจังหวัด</h2>
          <span id="provinces-updated" class="text-xs text-slate-400"></span>
        </div>
        <div class="flex flex-wrap items-end justify-between gap-3 my-3">
          <div id="usage-filter" class="flex flex-wrap gap-2 w-full md:w-auto" role="radiogroup" aria-label="กรองตามสถานะการใช้งาน"></div>
          <label class="flex items-center gap-1.5 w-full md:w-[220px] h-9 px-2.5 border border-slate-200 rounded-[10px] text-slate-400 focus-within:border-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
            <input id="province-search" type="search" placeholder="ค้นหาจังหวัด" oninput="renderProvinceTable()" class="w-full border-0 outline-none bg-transparent text-slate-900 text-sm">
          </label>
        </div>
        <div class="flex-1 min-h-0 overflow-auto border border-slate-100 rounded-xl">
          <table class="data-table w-full min-w-[900px] border-separate border-spacing-0 text-sm">
            <thead id="province-head"></thead>
            <tbody id="province-body"></tbody>
          </table>
          <p id="province-empty" class="hidden m-0 p-6 text-sm text-slate-500 text-center">ไม่พบจังหวัดที่ค้นหา</p>
        </div>
        <p class="mt-2 mb-0 text-xs text-slate-400">
          <i data-lucide="info" class="inline w-3.5 h-3.5 -mt-0.5"></i>
          Mock นี้กดดูรายละเอียดได้ 3 จังหวัด: <span id="mock-provinces"></span>
        </p>
      </section>
    </main>
  </div>

    const DETAIL_PROVINCES = ["กรุงเทพมหานคร","สระบุรี","นครราชสีมา"];

    const USAGE_STATUS = {
      complete: { label: "ครบทุกหน่วยราชการ", tone: "complete" },
      partial: { label: "ใช้งานบางพื้นที่", tone: "partial" },
      pending_training: { label: "รอการอบรม", tone: "pending" },
    };
    const THAI_MONTHS_SHORT = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const MIN_YEAR = 2017;

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const formatNumber = (value) => (value == null ? "—" : value.toLocaleString("en-US"));
    const formatThaiDateTime = (iso) => (iso ? new Date(iso).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }) : "—");
    const toYearMonth = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    function formatDuration(seconds) {
      if (seconds == null) return "—";
      const minutes = seconds / 60;
      if (minutes < 60) return `${minutes.toFixed(2)} นาที`;
      const hours = minutes / 60;
      if (hours < 48) return `${hours.toFixed(2)} ชม.`;
      return `${(hours / 24).toFixed(2)} วัน`;
    }
    function formatThaiMonth(yearMonth) {
      const [year, month] = yearMonth.split("-").map(Number);
      return `${THAI_MONTHS_SHORT[month - 1]} ${year + 543}`;
    }
    function formatThaiMonthRange(from, to) {
      if (from === to) return formatThaiMonth(from);
      const [fromYear, fromMonth] = from.split("-").map(Number);
      if (fromYear === Number(to.slice(0, 4))) return `${THAI_MONTHS_SHORT[fromMonth - 1]} – ${formatThaiMonth(to)}`;
      return `${formatThaiMonth(from)} – ${formatThaiMonth(to)}`;
    }
    function shiftMonth(yearMonth, delta) {
      const [year, month] = yearMonth.split("-").map(Number);
      return toYearMonth(new Date(year, month - 1 + delta, 1));
    }
    function countMonths(from, to) {
      const [fy, fm] = from.split("-").map(Number);
      const [ty, tm] = to.split("-").map(Number);
      return (ty - fy) * 12 + tm - fm + 1;
    }
    const provinceUrl = (name) => `./org-group-stats-province.html?province=${encodeURIComponent(name)}`;

    function showToast(message) {
      const root = document.getElementById("toast-root");
      root.innerHTML = `<div class="toast fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm shadow-lg max-w-[90vw]">${escapeHtml(message)}</div>`;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => (root.innerHTML = ""), 2600);
    }

    function goBack() {
      if (history.length > 1 && document.referrer) {
        history.back();
        return false;
      }
      return true;
    }

    function statTile({ label, value, previous, upIsGood, compact, deltaLabel = "จากเดือนก่อน" }) {
      const change = value != null && previous ? ((value - previous) / previous) * 100 : null;
      let delta = "";
      if (change != null) {
        const tone = upIsGood == null || change === 0 ? "text-slate-500" : (change > 0) === upIsGood ? "text-[#0a7a0a]" : "text-[#b42318]";
        const icon = change >= 0 ? "arrow-up-right" : "arrow-down-right";
        delta = `<p class="flex items-center gap-0.5 mt-0.5 mb-0 text-xs ${tone}"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${Math.abs(change).toFixed(1)}% ${escapeHtml(deltaLabel)}</p>`;
      }
      return `
        <div class="${compact ? "px-3.5 py-2.5" : "px-4 py-3.5"} border border-slate-100 rounded-xl bg-slate-50">
          <p class="m-0 text-[13px] text-slate-500">${escapeHtml(label)}</p>
          <p class="m-0 ${compact ? "text-[22px]" : "text-[28px]"} font-semibold leading-tight text-slate-900">${formatNumber(value)}</p>
          ${delta}
        </div>`;
    }

    /* ---------- ภาพรวม ---------- */
    function renderOverall() {
      const summary = DATA.overall.stats_data[0];
      document.getElementById("overall-updated").textContent = `อัปเดต ${formatThaiDateTime(DATA.overall.updated_at)}`;
      document.getElementById("overall-tiles").innerHTML = [
        { key: "alltime_created", label: "หน่วยงานในระบบ" },
        { key: "alltime_used", label: "หน่วยงานที่มีการใช้งาน" },
        { key: "alltime_post_finish", label: "เรื่องที่แก้ไขเสร็จสิ้น" },
      ].map(({ key, label }) => statTile({ label, value: summary[key] })).join("");
    }

    /* ---------- สถิติรายเดือน (เลือกช่วงเดือนได้) ---------- */
    const MONTHLY_FIELDS = [
      { key: "created", label: "หน่วยงานสร้างใหม่", upIsGood: true },
      { key: "used", label: "หน่วยงานเริ่มใช้งาน", upIsGood: true },
      { key: "members", label: "เจ้าหน้าที่เพิ่มใหม่", upIsGood: true },
      { key: "post_new", label: "เรื่องแจ้งใหม่", upIsGood: null },
      { key: "post_finish", label: "เรื่องที่แก้ไขเสร็จสิ้น", upIsGood: true },
    ];
    const monthlyRows = DATA.monthly.stats_data;
    const latestMonth = monthlyRows.at(-1)?.date ?? toYearMonth(new Date());
    const maxMonth = toYearMonth(new Date());
    const pickerState = { from: latestMonth, to: latestMonth, open: false, viewYear: Number(latestMonth.slice(0, 4)), anchor: null, hovered: null };

    // the API only has per-month rows, so a range is the sum of the months inside it
    function sumRange(from, to) {
      const inRange = monthlyRows.filter((row) => row.date >= from && row.date <= to);
      const totals = Object.fromEntries(MONTHLY_FIELDS.map(({ key }) => [key, inRange.reduce((sum, row) => sum + (row[key] ?? 0), 0)]));
      return { months: inRange.length, totals };
    }

    function renderMonthly() {
      const { from, to } = pickerState;
      document.getElementById("month-label").textContent = formatThaiMonthRange(from, to);
      const span = countMonths(from, to);
      const previousFrom = shiftMonth(from, -span);
      const previousTo = shiftMonth(from, -1);
      const current = sumRange(from, to);
      const previous = sumRange(previousFrom, previousTo);
      const comparable = previous.months === span;
      const deltaLabel = span === 1 ? "จากเดือนก่อน" : `จาก ${formatThaiMonthRange(previousFrom, previousTo)}`;

      const coverage = document.getElementById("monthly-coverage");
      coverage.classList.toggle("hidden", !(current.months && current.months < span));
      coverage.textContent = `มีข้อมูล ${current.months} จาก ${span} เดือน`;

      const tiles = document.getElementById("monthly-tiles");
      if (!current.months) {
        tiles.innerHTML = `<p class="m-0 px-2 py-6 text-sm text-slate-500 text-center col-span-full">ยังไม่มีข้อมูลของ ${formatThaiMonthRange(from, to)} (มีข้อมูลตั้งแต่ ${formatThaiMonth(monthlyRows[0].date)})</p>`;
      } else {
        tiles.innerHTML = MONTHLY_FIELDS.map(({ key, label, upIsGood }) =>
          statTile({ label, value: current.totals[key], previous: comparable ? previous.totals[key] : null, upIsGood, compact: true, deltaLabel }),
        ).join("");
      }
      lucide.createIcons();
    }

    function renderMonthGrid() {
      const { viewYear, anchor, hovered } = pickerState;
      const [rangeFrom, rangeTo] = anchor ? [anchor, hovered ?? anchor].sort() : [pickerState.from, pickerState.to];
      const available = new Set(monthlyRows.map((row) => row.date));
      document.getElementById("view-year").textContent = viewYear + 543;
      document.getElementById("year-prev").disabled = viewYear <= MIN_YEAR;
      document.getElementById("year-next").disabled = viewYear >= Number(maxMonth.slice(0, 4));
      document.getElementById("month-hint").textContent = anchor ? "เลือกเดือนสิ้นสุด" : "เลือกเดือนเริ่มต้น";
      document.getElementById("month-grid").innerHTML = THAI_MONTHS_SHORT.map((label, index) => {
        const ym = `${viewYear}-${String(index + 1).padStart(2, "0")}`;
        const classes = ["relative h-9 rounded-lg bg-slate-50 text-slate-700 text-[13px] hover:bg-slate-200 disabled:bg-transparent disabled:text-slate-300 disabled:cursor-not-allowed"];
        if (ym === rangeFrom || ym === rangeTo) classes.push("month-selected");
        else if (ym > rangeFrom && ym < rangeTo) classes.push("month-in-range");
        if (available.has(ym)) classes.push("month-has-data");
        return `<button type="button" class="${classes.join(" ")}" onclick="selectMonth('${ym}')" onmouseenter="setHoveredMonth('${ym}')" ${ym > maxMonth ? "disabled" : ""}>${label}</button>`;
      }).join("");
    }

    function toggleMonthPicker() {
      pickerState.open = !pickerState.open;
      pickerState.anchor = null;
      pickerState.viewYear = Number(pickerState.to.slice(0, 4));
      document.getElementById("month-popover").classList.toggle("hidden", !pickerState.open);
      if (pickerState.open) renderMonthGrid();
    }
    function closeMonthPicker() {
      pickerState.open = false;
      document.getElementById("month-popover").classList.add("hidden");
    }
    function shiftViewYear(delta) {
      pickerState.viewYear += delta;
      renderMonthGrid();
    }
    function setHoveredMonth(ym) {
      if (!pickerState.anchor) return;
      pickerState.hovered = ym;
      renderMonthGrid();
    }
    // first click picks the start month, second click the end; the same month twice selects one month
    function selectMonth(ym) {
      if (!pickerState.anchor) {
        pickerState.anchor = ym;
        renderMonthGrid();
        return;
      }
      [pickerState.from, pickerState.to] = [pickerState.anchor, ym].sort();
      pickerState.anchor = null;
      pickerState.hovered = null;
      closeMonthPicker();
      renderMonthly();
    }
    document.addEventListener("pointerdown", (event) => {
      if (pickerState.open && !document.getElementById("month-picker").contains(event.target)) closeMonthPicker();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMonthPicker();
    });

    /* ---------- สุขภาพรายจังหวัด ---------- */
    const provinceRows = DATA.provinces.stats_data;
    const tableState = { status: "all", sort: { key: "finish_percentage", desc: true } };
    const PROVINCE_COLUMNS = [
      { key: "province_name", label: "จังหวัด" },
      { key: "usage_status", label: "สถานะการใช้งาน" },
      { key: "total_agencies", label: "หน่วยงาน", numeric: true },
      { key: "total_messages", label: "เรื่องแจ้ง", numeric: true },
      { key: "finish_percentage", label: "ดำเนินการเสร็จ" },
      { key: "median_accept_time_sec", label: "รับเรื่อง (Median)", numeric: true },
      { key: "median_finish_time_sec", label: "แก้เสร็จ (Median)", numeric: true },
    ];

    function usageBadge(status) {
      const { label, tone } = USAGE_STATUS[status] ?? { label: status, tone: "all" };
      return `<span class="tone-${tone} inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs font-medium whitespace-nowrap"><span class="tone-dot w-1.5 h-1.5 rounded-full"></span>${escapeHtml(label)}</span>`;
    }

    function finishMeter(percent) {
      if (percent == null) return `<span class="text-slate-400">—</span>`;
      const health = percent >= 75
        ? { fill: "#0ca30c", track: "#dcf5dc", label: "ดี", icon: "circle-check" }
        : percent >= 50
          ? { fill: "#fab219", track: "#fef1d2", label: "พอใช้", icon: "triangle-alert" }
          : { fill: "#d03b3b", track: "#f8dddd", label: "ต้องติดตาม", icon: "circle-alert" };
      return `
        <div class="grid grid-cols-[56px_minmax(64px,1fr)_84px] items-center gap-2" title="ดำเนินการเสร็จ ${percent}% (${health.label})">
          <span class="text-[13px] font-semibold text-slate-900 text-right tabular-nums">${percent.toFixed(2)}%</span>
          <span class="h-1.5 rounded-full overflow-hidden" style="background:${health.track}"><span class="block h-full rounded-full" style="width:${Math.min(percent, 100)}%;background:${health.fill}"></span></span>
          <span class="flex items-center gap-1 text-xs text-slate-700 whitespace-nowrap"><i data-lucide="${health.icon}" class="w-3.5 h-3.5" style="color:${health.fill}"></i>${health.label}</span>
        </div>`;
    }

    function renderUsageFilter() {
      const summarize = (rows) => ({ provinces: rows.length, agencies: rows.reduce((sum, row) => sum + (row.total_agencies ?? 0), 0) });
      const options = [
        { key: "all", label: "ทุกจังหวัด", tone: "all", ...summarize(provinceRows) },
        ...Object.entries(USAGE_STATUS).map(([key, { label, tone }]) => ({ key, label, tone, ...summarize(provinceRows.filter((row) => row.usage_status === key)) })),
      ];
      document.getElementById("usage-filter").innerHTML = options.map(({ key, label, tone, provinces, agencies }) => {
        const active = tableState.status === key;
        return `
          <button type="button" role="radio" aria-checked="${active}" onclick="setUsageFilter('${key}')"
            class="filter-option tone-${tone} ${active ? "is-active" : ""} relative grid flex-[1_1_calc(50%-4px)] md:flex-none md:min-w-[128px] px-3 py-2 border border-slate-200 rounded-[10px] bg-white text-left transition-colors">
            <span class="flex items-center gap-1.5 text-xs ${active ? "text-slate-700 pr-5" : "text-slate-500"}">
              ${key !== "all" ? `<span class="tone-dot w-2 h-2 rounded-full"></span>` : ""}${escapeHtml(label)}
            </span>
            <span class="text-base font-semibold text-slate-900">${provinces} จังหวัด</span>
            <span class="text-[11px] text-slate-400">${formatNumber(agencies)} หน่วยงาน</span>
            ${active ? `<span class="filter-check absolute top-2 right-2 w-4 h-4 grid place-items-center rounded-full text-white text-[10px] font-bold leading-none">✓</span>` : ""}
          </button>`;
      }).join("");
    }

    function setUsageFilter(key) {
      tableState.status = key;
      renderUsageFilter();
      renderProvinceTable();
    }

    function sortProvinces(key) {
      const prev = tableState.sort;
      tableState.sort = { key, desc: prev.key === key ? !prev.desc : key !== "province_name" };
      renderProvinceTable();
    }

    function compareRows(a, b, { key, desc }) {
      if (a[key] == null) return 1;
      if (b[key] == null) return -1;
      const result = typeof a[key] === "string" ? a[key].localeCompare(b[key], "th") : a[key] - b[key];
      return desc ? -result : result;
    }

    function openProvince(name) {
      if (DETAIL_PROVINCES.includes(name)) window.location.href = provinceUrl(name);
      else showToast(`Mock นี้มีรายละเอียดเฉพาะ ${DETAIL_PROVINCES.join(", ")}`);
    }

    function renderProvinceTable() {
      const { sort, status } = tableState;
      const keyword = document.getElementById("province-search").value.trim();
      const rows = provinceRows
        .filter((row) => (status === "all" || row.usage_status === status) && row.province_name.includes(keyword))
        .sort((a, b) => compareRows(a, b, sort));

      document.getElementById("province-head").innerHTML = `<tr>${PROVINCE_COLUMNS.map(({ key, label, numeric }) => `
        <th class="sticky top-0 z-[1] p-0 border-b border-slate-200 bg-slate-50 text-slate-500 text-xs font-semibold whitespace-nowrap ${numeric ? "text-right" : "text-left"}">
          <button type="button" onclick="sortProvinces('${key}')" class="w-full flex items-center gap-1 px-3 py-2.5 hover:text-slate-900 ${numeric ? "justify-end" : ""}">
            ${label}${sort.key === key ? `<i data-lucide="${sort.desc ? "arrow-down" : "arrow-up"}" class="w-3 h-3"></i>` : ""}
          </button>
        </th>`).join("")}<th class="sticky top-0 border-b border-slate-200 bg-slate-50"></th></tr>`;

      document.getElementById("province-body").innerHTML = rows.map((row) => {
        const hasDetail = DETAIL_PROVINCES.includes(row.province_name);
        const td = "px-3 py-2 border-b border-slate-100 text-slate-700 whitespace-nowrap";
        return `
          <tr class="cursor-pointer group" onclick="openProvince('${escapeHtml(row.province_name)}')">
            <td class="${td} font-semibold"><span class="text-slate-900 ${hasDetail ? "group-hover:text-blue-600 group-hover:underline" : ""}">${escapeHtml(row.province_name)}</span></td>
            <td class="${td}">${usageBadge(row.usage_status)}</td>
            <td class="${td} text-right tabular-nums">${formatNumber(row.total_agencies)}</td>
            <td class="${td} text-right tabular-nums">${formatNumber(row.total_messages)}</td>
            <td class="${td}">${finishMeter(row.finish_percentage)}</td>
            <td class="${td} text-right tabular-nums">${formatDuration(row.median_accept_time_sec)}</td>
            <td class="${td} text-right tabular-nums">${formatDuration(row.median_finish_time_sec)}</td>
            <td class="${td} w-px pl-0 ${hasDetail ? "text-slate-400 group-hover:text-slate-600" : "text-slate-200"}"><i data-lucide="chevron-right" class="w-4 h-4"></i></td>
          </tr>`;
      }).join("");
      document.getElementById("province-empty").classList.toggle("hidden", rows.length > 0);
      lucide.createIcons();
    }

    document.getElementById("snapshot-date").textContent = formatThaiDateTime(DATA.provinces.updated_at);
    document.getElementById("provinces-updated").textContent = `อัปเดต ${formatThaiDateTime(DATA.provinces.updated_at)}`;
    document.getElementById("mock-provinces").innerHTML = DETAIL_PROVINCES.map((name) => `<a class="text-blue-600 hover:underline" href="${provinceUrl(name)}">${escapeHtml(name)}</a>`).join(", ");
    renderOverall();
    renderMonthly();
    renderUsageFilter();
    renderProvinceTable();
    lucide.createIcons();
  </script>
</body>
</html>
